name: Build DisVibe Windows EXE

on:
  push:
    branches:
      - disvibe/windows-exe-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Reconstruct source archive
        shell: pwsh
        run: |
          $parts = @(
            ".build-source/source.tar.xz.part1",
            ".build-source/source.tar.xz.part2a",
            ".build-source/source.tar.xz.part2b",
            ".build-source/source.tar.xz.part2c",
            ".build-source/source.tar.xz.part2"
          )
          $encoded = ""
          foreach ($part in $parts) {
            if (!(Test-Path $part)) { throw "Missing source archive part: $part" }
            $encoded += [System.IO.File]::ReadAllText((Resolve-Path $part))
          }
          $bytes = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes("$PWD\source.tar.xz", $bytes)
          tar -xJf source.tar.xz
          if (!(Test-Path "DisVibe\desktop_disvibe.py")) { throw "DisVibe source extraction failed." }

      - name: Install build dependencies
        working-directory: DisVibe
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run backend and desktop tests
        working-directory: DisVibe
        run: python -m unittest discover -s tests -v

      - name: Build single-file desktop executable
        working-directory: DisVibe
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DisVibe --icon assets\disvibe.ico --add-data "web;web" --add-data "assets;assets" --collect-all fastapi --collect-all starlette --collect-all uvicorn --collect-all websockets --collect-all webview --collect-all bottle --collect-all pythonnet --collect-all clr_loader --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto --hidden-import uvicorn.lifespan.on desktop_disvibe.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build failed." }
          if (!(Test-Path "dist\DisVibe.exe")) { throw "DisVibe.exe was not produced." }
          $size = (Get-Item "dist\DisVibe.exe").Length
          if ($size -lt 15000000) { throw "DisVibe.exe looks incomplete ($size bytes)." }

      - name: Verify packaged executable
        working-directory: DisVibe
        run: .\dist\DisVibe.exe --self-test

      - name: Generate SHA-256
        working-directory: DisVibe
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\DisVibe.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DisVibe.exe" | Set-Content "dist\DisVibe.exe.sha256" -Encoding ascii

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: DisVibe-Windows-x64-EXE
          path: |
            DisVibe/dist/DisVibe.exe
            DisVibe/dist/DisVibe.exe.sha256
          if-no-files-found: error
          retention-days: 30
